<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>St. Patrick's Animal Hunt — Role Medals</title>
<link href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&family=Fredoka+One&family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#1e1e1e;
    font-family:'Fredoka',sans-serif;
    padding:40px;
    display:flex; flex-direction:column; align-items:center; gap:40px;
  }
  h1 { color:rgba(255,255,255,0.45); font-family:'Fredoka One',cursive; font-size:18px; text-align:center; }
  .hint { color:rgba(255,255,255,0.3); font-size:13px; text-align:center; margin-top:-30px; }

  /* Grid of medals */
  .medals-grid {
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:36px;
    max-width:760px;
    width:100%;
  }
  .medal-wrap {
    display:flex; flex-direction:column; align-items:center; gap:0;
  }

  /* ── RIBBON ── */
  .ribbon-top {
    width:70px; height:60px;
    display:flex; flex-direction:column; align-items:center;
    position:relative; z-index:1;
  }
  .ribbon-bar {
    width:36px; height:100%;
    border-radius:4px 4px 0 0;
  }
  .ribbon-v {
    position:absolute; bottom:-4px;
    display:flex;
    filter:drop-shadow(0 2px 4px rgba(0,0,0,0.3));
  }
  .rv-l { width:0; height:0; border-top:16px solid transparent; border-right:22px solid transparent; }
  .rv-r { width:0; height:0; border-top:16px solid transparent; border-left:22px solid transparent; }

  /* ── MEDAL CIRCLE ── */
  .medal-circle {
    width:190px; height:190px;
    border-radius:50%;
    position:relative;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 10px 36px rgba(0,0,0,0.5), 0 2px 8px rgba(0,0,0,0.3);
  }

  /* Outer gold ring with ridged effect */
  .medal-ring {
    position:absolute; inset:0;
    border-radius:50%;
    background: conic-gradient(
      #D4AF37 0deg, #f5d47a 18deg,
      #D4AF37 36deg, #f5d47a 54deg,
      #D4AF37 72deg, #f5d47a 90deg,
      #D4AF37 108deg, #f5d47a 126deg,
      #D4AF37 144deg, #f5d47a 162deg,
      #D4AF37 180deg, #f5d47a 198deg,
      #D4AF37 216deg, #f5d47a 234deg,
      #D4AF37 252deg, #f5d47a 270deg,
      #D4AF37 288deg, #f5d47a 306deg,
      #D4AF37 324deg, #f5d47a 342deg,
      #D4AF37 360deg
    );
  }

  /* Inner colored disc */
  .medal-inner {
    width:154px; height:154px;
    border-radius:50%;
    position:relative;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:2px;
    overflow:hidden;
    box-shadow: inset 0 4px 14px rgba(0,0,0,0.35), inset 0 -2px 6px rgba(255,255,255,0.1);
  }

  /* Sunburst rays */
  .sunburst {
    position:absolute; inset:0; border-radius:50%;
    background: repeating-conic-gradient(rgba(255,255,255,0.06) 0deg 9deg, transparent 9deg 18deg);
  }

  /* Shine spot */
  .shine {
    position:absolute; top:12px; left:26px;
    width:40px; height:22px;
    background:radial-gradient(ellipse, rgba(255,255,255,0.22) 0%, transparent 80%);
    border-radius:50%;
  }

  /* Inner gold ring line */
  .inner-ring {
    position:absolute; inset:8px; border-radius:50%;
    border:1.5px solid rgba(212,175,55,0.45);
  }

  /* Content */
  .m-top-text {
    font-family:'Fredoka One',cursive; font-size:9px;
    color:#fff; letter-spacing:2px; text-transform:uppercase;
    position:relative; z-index:2;
    background:rgba(0,0,0,0.45);
    padding:2px 8px; border-radius:10px;
    text-shadow:0 1px 3px rgba(0,0,0,0.8);
  }
  .m-icon { font-size:42px; position:relative; z-index:2; filter:drop-shadow(0 3px 8px rgba(0,0,0,0.35)); }
  .m-role { font-family:'Uncial Antiqua',cursive; font-size:16px; color:white; text-align:center; line-height:1.2; position:relative; z-index:2; text-shadow:0 2px 4px rgba(0,0,0,0.5); }
  .m-subtitle { font-family:'Fredoka One',cursive; font-size:9px; color:rgba(255,255,255,0.65); letter-spacing:1px; text-transform:uppercase; position:relative; z-index:2; }

  /* Name plate below medal */
  .name-plate {
    width:160px;
    background:white;
    border:2px solid #D4AF37;
    border-radius:8px;
    padding:5px 10px;
    text-align:center;
    margin-top:8px;
    box-shadow:0 3px 10px rgba(0,0,0,0.2);
  }
  .name-label { font-size:9px; color:#aaa; letter-spacing:2px; text-transform:uppercase; font-weight:600; margin-bottom:2px; }
  .name-line { border-bottom:1.5px solid #1A6B3C; height:20px; }

  /* Bottom shamrocks */
  .medal-shamrocks { font-size:13px; color:rgba(255,255,255,0.3); margin-top:4px; letter-spacing:3px; }

  /* Page break for print */
  @media print {
    body{background:white;padding:20px;}
    h1,.hint{display:none;}
    .medals-grid{grid-template-columns:repeat(3,1fr);gap:20px;}
    .medal-circle{box-shadow:none;}
    .name-plate{box-shadow:none;}
  }
</style>
</head>
<body>
<h1>🏅 Role Medals — One per student, based on their team role</h1>
<div class="hint">Print on cardstock · Cut · Punch a hole at the top of the ribbon · Thread a green ribbon or string</div>

<div class="medals-grid">
  <script>
  const roles = [
    {
      role:'Reader', icon:'📖', color1:'#1565C0', color2:'#0d3b6e',
      ribbon:'#1565C0', rvColor:'#0d3b6e',
      sub:'Best Reader',
      top:'St. Patrick\'s Hunt',
    },
    {
      role:'Writer', icon:'✏️', color1:'#6A1B9A', color2:'#38006b',
      ribbon:'#6A1B9A', rvColor:'#38006b',
      sub:'Best Writer',
      top:'St. Patrick\'s Hunt',
    },
    {
      role:'Scanner', icon:'📱', color1:'#00796B', color2:'#003d33',
      ribbon:'#00796B', rvColor:'#003d33',
      sub:'Best Scanner',
      top:'St. Patrick\'s Hunt',
    },
    {
      role:'Speaker', icon:'🗣️', color1:'#E65100', color2:'#8c2e00',
      ribbon:'#E65100', rvColor:'#8c2e00',
      sub:'Best Speaker',
      top:'St. Patrick\'s Hunt',
    },
    {
      role:'Decider', icon:'🎯', color1:'#B71C1C', color2:'#7f0000',
      ribbon:'#B71C1C', rvColor:'#7f0000',
      sub:'Best Decider',
      top:'St. Patrick\'s Hunt',
    },
    {
      role:'Champion', icon:'🏆', color1:'#1A6B3C', color2:'#0e3d22',
      ribbon:'#D4AF37', rvColor:'#b8952e',
      sub:'Snake Expeller!',
      top:'St. Patrick\'s Hunt',
    },
  ];

  roles.forEach(r => {
    document.write(`
    <div class="medal-wrap">
      <!-- Ribbon -->
      <div class="ribbon-top">
        <div class="ribbon-bar" style="background:linear-gradient(180deg,${r.ribbon},${r.rvColor});"></div>
        <div class="ribbon-v">
          <div class="rv-l" style="border-right-color:${r.ribbon};"></div>
          <div class="rv-r" style="border-left-color:${r.ribbon};"></div>
        </div>
      </div>

      <!-- Medal -->
      <div class="medal-circle">
        <div class="medal-ring"></div>
        <div class="medal-inner" style="background:radial-gradient(circle at 35% 30%, ${r.color1} 0%, ${r.color2} 100%);">
          <div class="sunburst"></div>
          <div class="shine"></div>
          <div class="inner-ring"></div>
          <div class="m-top-text">${r.top}</div>
          <div class="m-icon">${r.icon}</div>
          <div class="m-role">${r.role}</div>
          <div class="m-subtitle">${r.sub}</div>
        </div>
      </div>

      <!-- Name plate -->
      <div class="name-plate">
        <div class="name-label">Name</div>
        <div class="name-line"></div>
      </div>
      <div class="medal-shamrocks">🍀 🍀 🍀</div>
    </div>
    `);
  });
  </script>
</div>

<!-- Second row: mini versions (4-up per page for extra copies) -->
<h1 style="margin-top:20px;">Mini versions — 6 per page (extra copies)</h1>
<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:20px;max-width:760px;width:100%;">
<script>
const roles2 = [
  { role:'Reader',   icon:'📖', c1:'#1565C0', c2:'#0d3b6e', rb:'#1565C0', rv:'#0d3b6e' },
  { role:'Writer',   icon:'✏️', c1:'#6A1B9A', c2:'#38006b', rb:'#6A1B9A', rv:'#38006b' },
  { role:'Scanner',  icon:'📱', c1:'#00796B', c2:'#003d33', rb:'#00796B', rv:'#003d33' },
  { role:'Speaker',  icon:'🗣️', c1:'#E65100', c2:'#8c2e00', rb:'#E65100', rv:'#8c2e00' },
  { role:'Decider',  icon:'🎯', c1:'#B71C1C', c2:'#7f0000', rb:'#B71C1C', rv:'#7f0000' },
  { role:'Champion', icon:'🏆', c1:'#1A6B3C', c2:'#0e3d22', rb:'#D4AF37', rv:'#b8952e' },
];
roles2.forEach(r=>{
  document.write(`
  <div style="display:flex;flex-direction:column;align-items:center;gap:0;">
    <div style="width:36px;height:30px;display:flex;flex-direction:column;align-items:center;position:relative;z-index:1;">
      <div style="width:18px;height:100%;background:linear-gradient(180deg,${r.rb},${r.rv});border-radius:3px 3px 0 0;"></div>
      <div style="position:absolute;bottom:-3px;display:flex;">
        <div style="width:0;height:0;border-top:9px solid ${r.rb};border-right:13px solid transparent;"></div>
        <div style="width:0;height:0;border-top:9px solid ${r.rb};border-left:13px solid transparent;"></div>
      </div>
    </div>
    <div style="width:90px;height:90px;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,0.4);">
      <div style="position:absolute;inset:0;border-radius:50%;background:conic-gradient(#D4AF37 0deg,#f5d47a 20deg,#D4AF37 40deg,#f5d47a 60deg,#D4AF37 80deg,#f5d47a 100deg,#D4AF37 120deg,#f5d47a 140deg,#D4AF37 160deg,#f5d47a 180deg,#D4AF37 200deg,#f5d47a 220deg,#D4AF37 240deg,#f5d47a 260deg,#D4AF37 280deg,#f5d47a 300deg,#D4AF37 320deg,#f5d47a 340deg,#D4AF37 360deg);"></div>
      <div style="width:74px;height:74px;border-radius:50%;background:radial-gradient(circle at 35% 30%,${r.c1},${r.c2});display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative;overflow:hidden;box-shadow:inset 0 3px 10px rgba(0,0,0,0.35);">
        <div style="position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(rgba(255,255,255,0.06) 0deg 9deg,transparent 9deg 18deg);"></div>
        <div style="font-size:22px;position:relative;z-index:2;">${r.icon}</div>
        <div style="font-family:'Fredoka One',cursive;font-size:8px;color:white;position:relative;z-index:2;letter-spacing:0.5px;text-align:center;">${r.role}</div>
      </div>
    </div>
    <div style="width:80px;background:white;border:1.5px solid #D4AF37;border-radius:6px;padding:3px 6px;text-align:center;margin-top:4px;">
      <div style="font-size:7px;color:#aaa;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:2px;">Name</div>
      <div style="border-bottom:1px solid #1A6B3C;height:14px;"></div>
    </div>
  </div>
  `);
});
</script>
</div>



<script>/* auto-print/pdf on ?print=1 or ?pdf=1 */(function(){var p=new URLSearchParams(location.search);var pdf=p.get("pdf");var prn=p.get("print");if(pdf!=="1"&&prn!=="1")return;function whenReady(cb){if(document.readyState==="complete")setTimeout(cb,900);else window.addEventListener("load",function(){setTimeout(cb,1100);});}function preloadEmojis(){return new Promise(function(resolve){var imgs=document.querySelectorAll("img.emoji");if(!imgs.length){console.log("[PDF] no emojis");return resolve();}console.log("[PDF] preloading "+imgs.length+" emojis");var pending=imgs.length;var ok=0,fail=0;var safety=setTimeout(function(){console.warn("[PDF] emoji preload timeout ok="+ok+" fail="+fail);resolve();},20000);var done=function(){pending--;if(pending<=0){clearTimeout(safety);console.log("[PDF] emoji preload done ok="+ok+" fail="+fail);resolve();}};imgs.forEach(function(img){if(/^data:/.test(img.src)){ok++;done();return;}var m=img.src.match(/\/([a-f0-9\-]+)\.svg/i);if(!m){fail++;done();return;}var cp=m[1];var urls=["https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/svg/"+cp+".svg","https://cdn.jsdelivr.net/gh/twitter/twemoji@v14.0.2/assets/svg/"+cp+".svg","https://cdn.jsdelivr.net/gh/jdecked/twemoji@latest/assets/svg/"+cp+".svg"];var i=0;(function tryNext(){if(i>=urls.length){fail++;console.warn("[PDF] all URLs failed for "+cp);done();return;}var u=urls[i++];fetch(u).then(function(r){if(!r.ok)return Promise.reject("HTTP "+r.status);return r.text();}).then(function(svg){if(svg&&svg.indexOf("<svg")!==-1){try{img.src="data:image/svg+xml;base64,"+btoa(unescape(encodeURIComponent(svg)));ok++;done();return;}catch(e){console.warn("[PDF] btoa failed",cp,e);}}tryNext();}).catch(function(err){tryNext();});})();});});}function loadScript(src){return new Promise(function(resolve,reject){var s=document.createElement("script");s.src=src;s.crossOrigin="anonymous";s.onload=resolve;s.onerror=reject;document.head.appendChild(s);});}function loadLibs(){var p1=(typeof html2canvas==="function")?Promise.resolve():loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js");var p2=((window.jspdf&&window.jspdf.jsPDF)||window.jsPDF)?Promise.resolve():loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");return Promise.all([p1,p2]);}if(pdf==="1"){whenReady(function(){var size=(p.get("size")||"A4").toUpperCase();var orientation=(size==="A5")?"landscape":"portrait";var format=size.toLowerCase().replace(/[^a-z0-9]/g,"");if(format==="2xa4"||format==="2a4")format="a4";if(["a3","a4","a5"].indexOf(format)<0)format="a4";var sizeMM={"a3":[297,420],"a4":[210,297],"a5":[148,210]};var paper=sizeMM[format]||[210,297];var pdfW=(orientation==="landscape")?paper[1]:paper[0];var pdfH=(orientation==="landscape")?paper[0]:paper[1];var fn=(document.title||"lesson_print").replace(/[^A-Za-z0-9]+/g,"_").replace(/^_|_$/g,"").toLowerCase()+".pdf";function shotElem(elem){return html2canvas(elem,{scale:2,useCORS:true,allowTaint:true,logging:false,backgroundColor:"#ffffff",imageTimeout:9000,onclone:function(doc){var b=doc.body;b.style.padding="0";b.style.margin="0";b.style.minHeight="0";b.style.background="#ffffff";Array.prototype.forEach.call(doc.querySelectorAll(".print-note,.page-heading,.card-label"),function(el){el.style.display="none";});}});}function placeImage(doc,canvas,marginMM){var aspect=canvas.width/canvas.height;var availW=pdfW-marginMM*2;var availH=pdfH-marginMM*2;var imgW=availW,imgH=availW/aspect;if(imgH>availH){imgH=availH;imgW=availH*aspect;}var x=(pdfW-imgW)/2,y=(pdfH-imgH)/2;doc.addImage(canvas.toDataURL("image/jpeg",0.95),"JPEG",x,y,imgW,imgH);}function newDoc(){var Ctor=(window.jspdf&&window.jspdf.jsPDF)||window.jsPDF;return new Ctor({orientation:orientation,unit:"mm",format:format,compress:true});}function renderHero(elem){var doc=newDoc();return shotElem(elem).then(function(canvas){placeImage(doc,canvas,4);doc.save(fn);});}function renderMulti(elements){var doc=newDoc();return elements.reduce(functi </body>
</html>
