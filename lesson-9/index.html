<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>St. Patrick's Animal Hunt — All Materials</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#1a1a1a; font-family:'Fredoka',sans-serif; color:#f5f5f5; }
  .riddle-bar {
    padding:24px 20px;
    background:#222;
    border-bottom:1px solid #333;
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    justify-content:center;
    align-items:center;
  }
  .riddle-bar .label {
    font-weight:600;
    color:#bdbdbd;
    margin-right:8px;
    font-size:0.95rem;
  }
  .riddle-bar a {
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:8px 14px;
    background:#2d2d2d;
    border:1px solid #444;
    border-radius:999px;
    color:#f5f5f5;
    text-decoration:none;
    font-size:0.9rem;
    transition:border-color .15s ease, background .15s ease, transform .15s ease;
  }
  .riddle-bar a:hover {
    border-color:#7ed957;
    background:#333;
    transform:translateY(-1px);
  }
</style>
<style id="dl-all-style">
  .dl-all-btn {
    background: linear-gradient(135deg, #C62828, #F9A825);
    color: white !important;
    font-family: 'Fredoka One', sans-serif;
    font-size: 13px;
    text-decoration: none;
    padding: 8px 16px;
    border-radius: 8px;
    margin: 0 6px;
    white-space: nowrap;
    flex-shrink: 0;
    cursor: pointer;
    border: 2px solid rgba(255,255,255,0.18);
    transition: filter .15s, transform .12s;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .dl-all-btn:hover { filter: brightness(1.12); transform: translateY(-1px); }
  .dl-all-btn:active { transform: translateY(0); }
</style>
<script id="dl-all-script">
function downloadAllPrintables(){
  var p=[{u:'poster.html',s:'A3'},{u:'team-board.html',s:'A4'},{u:'qr-cards.html',s:'A5'},{u:'animal-cards.html',s:'A4'},{u:'medal.html',s:'A4'},{u:'diploma.html',s:'A4'},{u:'teacher-guide.html',s:'2xA4'}];
  if(!confirm('This will open '+p.length+' tabs to download all printables as PDF.\nMake sure popups are allowed for this site.\nContinue?')) return;
  p.forEach(function(it,i){
    setTimeout(function(){
      var w=window.open(it.u+'?pdf=1&size='+encodeURIComponent(it.s),'_blank');
      if(!w && i===0) alert('Popups blocked. Please allow popups for this site and try again.');
    }, i*1500);
  });
}
</script>
</head>
<body>
<nav class="riddle-bar">
  <span class="label">🧩 Direct riddles:</span>
  <a href="riddle.html?s=1" target="_blank" rel="noopener">🐴 Horse</a>
  <a href="riddle.html?s=2" target="_blank" rel="noopener">🐯 Tiger</a>
  <a href="riddle.html?s=3" target="_blank" rel="noopener">🦜 Parrot</a>
  <a href="riddle.html?s=4" target="_blank" rel="noopener">🐑 Sheep</a>
  <a href="riddle.html?s=5" target="_blank" rel="noopener">🐟 Fish</a>
<a class="dl-all-btn" href="#" onclick="event.preventDefault();downloadAllPrintables();return false;" title="Open one tab per printable; each downloads its own PDF">📦 Download all PDFs</a></nav>
<div id="root"></div>
<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard } = window;

function Frame({ src, width, height }) {
  return (
    <iframe
      src={src}
      style={{ width, height, border: 'none', display: 'block' }}
      scrolling="no"
      title={src}
    />
  );
}

function App() {
  return (
    <DesignCanvas title="🍀 St. Patrick's Animal Hunt — All Materials">

      <DCSection id="print1" title="Printable Classroom Materials">
        <DCArtboard id="poster" label="Introductory Poster (A3)" width={794} height={1123}
          download="poster.html" downloadFormat="A3">
          <Frame src="poster.html" width={794} height={1123} />
        </DCArtboard>
        <DCArtboard id="board" label="Team Board (A4)" width={794} height={1123}
          download="team-board.html" downloadFormat="A4">
          <Frame src="team-board.html" width={794} height={1123} />
        </DCArtboard>
        <DCArtboard id="qrcards" label="QR Station Cards (A5 × 5)" width={640} height={2380}
          download="qr-cards.html" downloadFormat="A5">
          <Frame src="qr-cards.html" width={640} height={2380} />
        </DCArtboard>
      </DCSection>

      <DCSection id="riddles" title="Interactive Riddles (open each in new tab for full experience)">
        <DCArtboard id="r1" label="Station 1 — Horse 🐴" width={800} height={600}>
          <Frame src="riddle.html?s=1" width={800} height={600} />
        </DCArtboard>
        <DCArtboard id="r2" label="Station 2 — Tiger 🐯" width={800} height={600}>
          <Frame src="riddle.html?s=2" width={800} height={600} />
        </DCArtboard>
        <DCArtboard id="r3" label="Station 3 — Parrot 🦜" width={800} height={600}>
          <Frame src="riddle.html?s=3" width={800} height={600} />
        </DCArtboard>
        <DCArtboard id="r4" label="Station 4 — Sheep 🐑" width={800} height={600}>
          <Frame src="riddle.html?s=4" width={800} height={600} />
        </DCArtboard>
        <DCArtboard id="r5" label="Station 5 — Fish 🐟" width={800} height={600}>
          <Frame src="riddle.html?s=5" width={800} height={600} />
        </DCArtboard>
      </DCSection>

      <DCSection id="cards" title="Collectible Animal Cards">
        <DCArtboard id="acards" label="All 5 Cards — Front & Back" width={640} height={1940}
          download="animal-cards.html" downloadFormat="A4">
          <Frame src="animal-cards.html" width={640} height={1940} />
        </DCArtboard>
      </DCSection>

      <DCSection id="rewards" title="Rewards & Teacher Materials">
        <DCArtboard id="medal" label="Medal (Printable)" width={860} height={560}
          download="medal.html" downloadFormat="A4">
          <Frame src="medal.html" width={860} height={560} />
        </DCArtboard>
        <DCArtboard id="diploma" label="Diploma (A4)" width={794} height={1123}
          download="diploma.html" downloadFormat="A4">
          <Frame src="diploma.html" width={794} height={1123} />
        </DCArtboard>
        <DCArtboard id="guide" label="Teacher's Guide (2 pages)" width={874} height={2700}
          download="teacher-guide.html" downloadFormat="2×A4">
          <Frame src="teacher-guide.html" width={874} height={2700} />
        </DCArtboard>
      </DCSection>

    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
