<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>St. Patrick's Animal Hunt — Collectible Cards</title>
<link href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&family=Fredoka+One&family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #2d2d2d;
    font-family: 'Fredoka', sans-serif;
    padding: 40px;
    display: flex; flex-direction: column; align-items: center; gap: 0;
  }
  h1 { color: white; font-family: 'Fredoka One', cursive; font-size: 20px; opacity: 0.6; margin-bottom: 24px; }
  .row {
    display: flex; gap: 20px; margin-bottom: 24px; align-items: flex-start;
  }
  .col-label {
    color: rgba(255,255,255,0.4);
    font-family: 'Fredoka One', cursive;
    font-size: 13px;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    transform: rotate(180deg);
    letter-spacing: 2px;
    text-transform: uppercase;
    align-self: center;
    margin-right: -4px;
  }

  /* Card: 63×88mm trading card → ~238×332px at 96dpi */
  .card {
    width: 238px; height: 332px;
    border-radius: 18px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    flex-shrink: 0;
  }

  /* ── FRONT ── */
  .card-front {
    display: flex; flex-direction: column;
    align-items: center;
    height: 100%;
  }

  .card-header {
    width: 100%;
    padding: 12px 14px 8px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .card-station {
    font-family: 'Fredoka One', cursive;
    font-size: 11px;
    color: rgba(255,255,255,0.75);
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .card-shamrocks { font-size: 13px; letter-spacing: 2px; opacity: 0.7; }

  .card-animal-area {
    flex: 1;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .card-emoji {
    font-size: 90px;
    filter: drop-shadow(0 6px 16px rgba(0,0,0,0.3));
    position: relative; z-index: 2;
  }

  /* Decorative circle behind emoji */
  .emoji-glow {
    width: 130px; height: 130px;
    background: rgba(255,255,255,0.12);
    border-radius: 50%;
    position: absolute;
    border: 2px solid rgba(255,255,255,0.2);
  }

  .card-footer {
    width: 100%;
    padding: 10px 14px 14px;
    text-align: center;
    background: rgba(0,0,0,0.18);
  }
  .card-animal-name {
    font-family: 'Uncial Antiqua', cursive;
    font-size: 22px;
    color: white;
    text-shadow: 0 2px 8px rgba(0,0,0,0.3);
    margin-bottom: 2px;
  }
  .card-subtitle {
    font-size: 11px;
    color: rgba(255,255,255,0.7);
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* Gold border all cards */
  .gold-border {
    position: absolute; inset: 6px;
    border: 2.5px solid rgba(212,175,55,0.7);
    border-radius: 13px;
    pointer-events: none;
    z-index: 10;
  }
  .gold-border::before {
    content: '🍀';
    position: absolute; top: -8px; left: 50%; transform: translateX(-50%);
    font-size: 14px;
  }
  .corner-gem {
    position: absolute;
    width: 10px; height: 10px;
    background: #D4AF37;
    border-radius: 50%;
    z-index: 11;
  }

  /* ── BACK ── */
  .card-back {
    display: flex; flex-direction: column;
    height: 100%;
  }
  .back-header {
    padding: 10px 12px 4px;
    text-align: center;
  }
  .back-title {
    font-family: 'Uncial Antiqua', cursive;
    font-size: 14px;
    color: white;
    margin-bottom: 0;
  }
  .back-emoji { font-size: 22px; line-height: 1; }

  .back-body {
    flex: 1;
    background: white;
    margin: 6px 10px 10px;
    border-radius: 12px;
    padding: 10px 10px;
    display: flex; flex-direction: column; gap: 6px;
    justify-content: center;
  }

  .fact {
    display: flex; align-items: flex-start; gap: 7px;
    padding: 6px 9px;
    border-radius: 9px;
    font-size: 12.5px;
    font-weight: 600;
    color: #2a2a2a;
    line-height: 1.35;
  }
  .fact-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }

  @media print {
    body { background: white; padding: 20px; }
    .card { box-shadow: none; }
    h1 { display: none; }
    .col-label { display: none; }
  }
</style>
</head>
<body>
<h1>🃏 Collectible Animal Cards — Print on cardstock, cut out</h1>

<script>
const animals = [
  {
    n:1, name:'Horse', emoji:'🐴', color:'#1A6B3C', dark:'#0e4526',
    facts:[
      {i:'💪', t:'Horses are very strong. They can carry people and heavy things!'},
      {i:'🏃', t:'A horse can run up to 55 km per hour. Very fast!'},
      {i:'🌾', t:'Horses eat grass and hay. They live on farms.'},
    ]
  },
  {
    n:2, name:'Tiger', emoji:'🐯', color:'#E8833A', dark:'#9e4a15',
    facts:[
      {i:'🟠', t:'Tigers are orange with black stripes. Every tiger is different!'},
      {i:'🌿', t:'Tigers live in the jungle. They can swim in rivers too!'},
      {i:'👑', t:'Tigers are the biggest wild cats in the world.'},
    ]
  },
  {
    n:3, name:'Parrot', emoji:'🦜', color:'#2A9D8F', dark:'#15584f',
    facts:[
      {i:'🌈', t:'Parrots can be red, green, blue and yellow. Very colourful!'},
      {i:'💬', t:'Parrots can learn to talk and copy human words!'},
      {i:'🌳', t:'Parrots live in the trees. They love tropical fruits.'},
    ]
  },
  {
    n:4, name:'Sheep', emoji:'🐑', color:'#7B5EA7', dark:'#4a3468',
    facts:[
      {i:'🤍', t:'Sheep have fluffy white wool. We use wool to make clothes!'},
      {i:'🔊', t:"Sheep say 'baa'! Baby sheep are called lambs."},
      {i:'🌾', t:'Sheep eat grass. They live in big groups called flocks.'},
    ]
  },
  {
    n:5, name:'Fish', emoji:'🐟', color:'#2176AE', dark:'#0e3f6e',
    facts:[
      {i:'💧', t:'Fish live in water. They breathe with special organs called gills!'},
      {i:'🏊', t:'Fish swim using their fins and tail. They are very fast!'},
      {i:'🌊', t:'Fish can live in rivers, lakes and in the sea.'},
    ]
  },
];

animals.forEach(a => {
  const lightBg = hexToRgba(a.color, 0.12);

  document.write(`
  <div class="row">
    <div class="col-label">Front</div>

    <!-- FRONT -->
    <div class="card" style="background: linear-gradient(150deg, ${a.color} 0%, ${a.dark} 100%);">
      <div class="gold-border">
        <div class="corner-gem" style="top:-3px;left:-3px;"></div>
        <div class="corner-gem" style="top:-3px;right:-3px;"></div>
        <div class="corner-gem" style="bottom:-3px;left:-3px;"></div>
        <div class="corner-gem" style="bottom:-3px;right:-3px;"></div>
      </div>
      <div class="card-front">
        <div class="card-header">
          <div class="card-station">Station ${a.n}</div>
          <div class="card-shamrocks">🍀🍀🍀</div>
        </div>
        <div class="card-animal-area">
          <div class="emoji-glow"></div>
          <div class="card-emoji">${a.emoji}</div>
        </div>
        <div class="card-footer">
          <div class="card-animal-name">${a.name}</div>
          <div class="card-subtitle">Animal Helper Card</div>
        </div>
      </div>
    </div>

    <div class="col-label" style="margin-left:8px;margin-right:-4px;">Back</div>

    <!-- BACK -->
    <div class="card" style="background: linear-gradient(150deg, ${a.dark} 0%, ${a.color} 100%);">
      <div class="gold-border">
        <div class="corner-gem" style="top:-3px;left:-3px;"></div>
        <div class="corner-gem" style="top:-3px;right:-3px;"></div>
        <div class="corner-gem" style="bottom:-3px;left:-3px;"></div>
        <div class="corner-gem" style="bottom:-3px;right:-3px;"></div>
      </div>
      <div class="card-back">
        <div class="back-header">
          <div class="back-emoji">${a.emoji}</div>
          <div class="back-title">${a.name} — Fun Facts!</div>
        </div>
        <div class="back-body">
          ${a.facts.map((f,i) => `
          <div class="fact" style="background:${hexToRgbaStr(a.color, 0.1)}">
            <span class="fact-icon">${f.i}</span>
            ${f.t}
          </div>`).join('')}
        </div>
      </div>
    </div>
  </div>
  `);
});

function hexToRgbaStr(hex, a) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}
function hexToRgba(hex, a) { return hexToRgbaStr(hex, a); }
</script>
</body>
</html>
