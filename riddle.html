<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>St. Patrick's Animal Hunt — Riddle</title>
<link href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&family=Fredoka+One&family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --c: #1A6B3C;
    --cl: #e8f5ee;
    --cd: #145530;
  }
  body {
    min-height: 100vh;
    background: #FAF6E9;
    font-family: 'Fredoka', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  .bg-blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(70px);
    opacity: 0.15;
    pointer-events: none;
    z-index: 0;
    animation: blobFloat 9s ease-in-out infinite;
  }
  .blob1 { width: 500px; height: 500px; background: var(--c); top: -120px; left: -150px; }
  .blob2 { width: 380px; height: 380px; background: #D4AF37; bottom: -80px; right: -80px; animation-delay: 3s; }
  @keyframes blobFloat { 0%,100%{transform:translate(0,0)} 50%{transform:translate(15px,-15px)} }

  /* Top bar */
  .top-bar {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 20px;
    z-index: 20;
    pointer-events: none;
  }
  .timer-badge {
    background: white;
    border: 2.5px solid var(--c);
    border-radius: 30px;
    padding: 7px 16px;
    font-family: 'Fredoka One', cursive;
    font-size: 16px;
    color: var(--c);
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    pointer-events: all;
  }
  .station-badge {
    display: flex; align-items: center; gap: 10px;
    background: var(--c);
    color: white;
    padding: 8px 20px;
    border-radius: 40px;
    font-family: 'Fredoka One', cursive;
    font-size: 18px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.2);
  }
  .station-num {
    width: 30px; height: 30px;
    background: white;
    color: var(--c);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; font-weight: 900;
  }
  .progress-bar {
    background: white;
    padding: 7px 14px;
    border-radius: 30px;
    border: 2px solid #D4AF37;
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    display: flex; gap: 5px;
    pointer-events: all;
  }
  .star { font-size: 20px; filter: grayscale(1) opacity(0.35); transition: all 0.4s; }
  .star.on { filter: none; }

  /* Card */
  .card {
    width: min(560px, 94vw);
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 60px;
  }
  /* Silhouette */
  .sil-wrap {
    width: 160px; height: 150px;
    position: relative;
    margin-bottom: -18px;
    z-index: 2;
    filter: drop-shadow(0 8px 20px rgba(0,0,0,0.15));
    transition: filter 0.4s;
  }
  .sil-wrap svg { width: 100%; height: 100%; }

  .riddle-card {
    background: white;
    border-radius: 26px;
    border: 3px solid var(--c);
    padding: 28px 28px 22px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.12);
    width: 100%;
    position: relative;
    overflow: hidden;
  }
  .riddle-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 5px;
    background: linear-gradient(90deg, var(--c), #D4AF37, var(--c));
  }

  .rh { text-align: center; margin-bottom: 16px; }
  .rh-icon { font-size: 28px; display: block; margin-bottom: 2px; }
  .rh-title { font-family: 'Fredoka One', cursive; font-size: 20px; color: var(--c); }

  .lines { display: flex; flex-direction: column; gap: 9px; margin-bottom: 20px; }
  .line {
    display: flex; align-items: center; gap: 10px;
    background: var(--cl);
    border-radius: 12px;
    padding: 11px 14px;
    font-size: 20px; font-weight: 600; color: #222;
    opacity: 0; transform: translateX(-14px);
    animation: lineIn 0.4s ease forwards;
  }
  .line:nth-child(1){animation-delay:.08s}
  .line:nth-child(2){animation-delay:.22s}
  .line:nth-child(3){animation-delay:.36s}
  .line:nth-child(4){animation-delay:.5s}
  @keyframes lineIn { to { opacity:1; transform:translateX(0); } }
  .line-ico { font-size: 20px; flex-shrink: 0; }

  .question {
    text-align: center;
    font-family: 'Uncial Antiqua', cursive;
    font-size: 22px;
    color: var(--c);
    margin-bottom: 16px;
    opacity: 0; animation: lineIn 0.4s 0.65s ease forwards;
  }
  .hint-box {
    display: none;
    background: #fff8e0;
    border: 2px dashed #D4AF37;
    border-radius: 11px;
    padding: 9px 14px;
    margin-bottom: 14px;
    font-size: 15px; color: #7a6000; text-align: center; font-weight: 600;
    animation: fadeUp 0.4s ease;
  }
  .hint-box.show { display: block; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

  .input-row {
    display: flex; gap: 10px;
    opacity: 0; animation: lineIn 0.4s 0.8s ease forwards;
  }
  .ans-input {
    flex: 1;
    font-family: 'Fredoka', sans-serif;
    font-size: 21px; font-weight: 600;
    border: 3px solid #ddd;
    border-radius: 13px;
    padding: 11px 16px;
    outline: none; color: #222;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .ans-input:focus { border-color: var(--c); box-shadow: 0 0 0 4px rgba(26,107,60,0.12); }
  .ans-input.ok { border-color: #1A6B3C; background: #f0fff4; }
  .ans-input.err { border-color: #e55; animation: shake 0.4s ease; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-7px)} 40%{transform:translateX(7px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }

  .check-btn {
    font-family: 'Fredoka One', cursive;
    font-size: 21px;
    background: var(--c);
    color: white;
    border: none; border-radius: 13px;
    padding: 11px 26px;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.18);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .check-btn:hover { transform: translateY(-2px); box-shadow: 0 7px 20px rgba(0,0,0,0.22); }
  .check-btn:disabled { background: #bbb; box-shadow: none; cursor: default; }

  .fail-banner {
    display: none;
    background: #fff0f0;
    border: 2px solid #e55;
    border-radius: 12px;
    padding: 10px 14px;
    margin-top: 12px;
    text-align: center;
    font-size: 17px; font-weight: 600; color: #c00;
    animation: fadeUp 0.3s ease;
  }
  .fail-banner.show { display: block; }

  /* Success overlay */
  .overlay {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.35);
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s;
  }
  .overlay.show { opacity: 1; pointer-events: all; }
  .ov-box {
    background: white;
    border-radius: 26px;
    padding: 38px 44px;
    text-align: center;
    max-width: 400px; width: 90%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    border: 4px solid var(--c);
    transform: scale(0.7);
    transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
  }
  .overlay.show .ov-box { transform: scale(1); }
  .ov-emoji { font-size: 68px; display: block; margin-bottom: 10px; }
  .ov-title { font-family: 'Uncial Antiqua', cursive; font-size: 28px; color: var(--c); margin-bottom: 6px; }
  .ov-sub { font-size: 18px; color: #555; margin-bottom: 22px; font-weight: 600; }
  .ov-btn {
    font-family: 'Fredoka One', cursive; font-size: 19px;
    background: var(--c); color: white; border: none;
    border-radius: 12px; padding: 11px 30px; cursor: pointer;
    transition: transform 0.15s;
  }
  .ov-btn:hover { transform: scale(1.04); }

  /* Bottom UI */
  .bottom-ui {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    z-index: 20; pointer-events: none;
  }
  .roles {
    display: flex; gap: 7px; flex-wrap: nowrap;
  }
  .role {
    background: white;
    border: 2px solid var(--c);
    border-radius: 20px;
    padding: 4px 11px;
    font-size: 12px; font-weight: 600; color: var(--c);
    white-space: nowrap;
  }
  .obj-tag {
    background: var(--c);
    color: white;
    font-family: 'Fredoka One', cursive;
    font-size: 16px;
    padding: 7px 22px;
    border-radius: 28px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.15);
  }

  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 99; }
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div class="bg-blob blob1"></div>
<div class="bg-blob blob2"></div>

<!-- Top bar -->
<div class="top-bar">
  <div class="timer-badge" id="timerBadge">⏱ ~5 min</div>
  <div class="station-badge" id="stationBadge">
    <div class="station-num" id="stNum">1</div>
    <span id="stLabel">Station 1 of 5</span>
  </div>
  <div class="progress-bar" id="progressBar">
    <span class="star" id="s0">⭐</span>
    <span class="star" id="s1">⭐</span>
    <span class="star" id="s2">⭐</span>
    <span class="star" id="s3">⭐</span>
    <span class="star" id="s4">⭐</span>
  </div>
</div>

<!-- Main card -->
<div class="card">
  <div class="sil-wrap" id="silWrap">
    <svg id="silSvg" viewBox="0 0 160 150" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- shapes filled by JS -->
    </svg>
  </div>

  <div class="riddle-card">
    <div class="rh">
      <span class="rh-icon">🤔</span>
      <div class="rh-title">Read the clues. What animal am I?</div>
    </div>
    <div class="lines" id="linesDiv"></div>
    <div class="question" id="questionDiv">What am I? 🍀</div>
    <div class="hint-box" id="hintBox"></div>
    <div class="input-row">
      <input type="text" class="ans-input" id="ansInput" placeholder="Type your answer…"
        autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"/>
      <button class="check-btn" id="checkBtn" onclick="check()">Check! ✅</button>
    </div>
    <div class="fail-banner" id="failBanner">❌ Try again! Read the clues carefully. 🍀</div>
  </div>
</div>

<!-- Overlay -->
<div class="overlay" id="overlay">
  <div class="ov-box">
    <span class="ov-emoji" id="ovEmoji"></span>
    <div class="ov-title">Well done, Animal Helper!</div>
    <div class="ov-sub" id="ovSub"></div>
    <button class="ov-btn" onclick="document.getElementById('overlay').classList.remove('show')">🃏 Get my card!</button>
  </div>
</div>

<div class="bottom-ui">
  <div class="roles">
    <div class="role">📖 Reader</div>
    <div class="role">✏️ Writer</div>
    <div class="role">📱 Scanner</div>
    <div class="role">🗣 Speaker</div>
    <div class="role">🎯 Decider</div>
  </div>
  <div class="obj-tag">🎯 5 animals = Victory!</div>
</div>

<script>
const STATIONS = [
  {
    n: 1, animal: 'Horse', emoji: '🐴',
    color: '#1A6B3C', light: '#e8f5ee', dark: '#145530',
    clues: [
      {i:'💪', t:'I am big and strong.'},
      {i:'🌾', t:'I live on a farm.'},
      {i:'🏃', t:'I can run very fast.'},
      {i:'🦵', t:'I have four legs.'},
    ],
    hint: 'My name starts with the letter <strong>H</strong>!',
    answers: ['horse','a horse'],
    shape: drawHorse,
  },
  {
    n: 2, animal: 'Tiger', emoji: '🐯',
    color: '#E8833A', light: '#fde8d3', dark: '#c4692a',
    clues: [
      {i:'🟠', t:'I am orange with black stripes.'},
      {i:'🌿', t:'I live in the jungle.'},
      {i:'🦷', t:'I have very sharp teeth.'},
      {i:'👑', t:'I am very big and strong.'},
    ],
    hint: 'My name starts with the letter <strong>T</strong>!',
    answers: ['tiger','a tiger'],
    shape: drawTiger,
  },
  {
    n: 3, animal: 'Parrot', emoji: '🦜',
    color: '#2A9D8F', light: '#e0f5f3', dark: '#1e7a70',
    clues: [
      {i:'🌈', t:'I am red and green.'},
      {i:'🌳', t:'I live in the trees.'},
      {i:'💬', t:'I can talk!'},
      {i:'🪶', t:'I have two wings.'},
    ],
    hint: 'My name starts with the letter <strong>P</strong>!',
    answers: ['parrot','a parrot'],
    shape: drawParrot,
  },
  {
    n: 4, animal: 'Sheep', emoji: '🐑',
    color: '#7B5EA7', light: '#f0ebf8', dark: '#5e4680',
    clues: [
      {i:'🤍', t:'I am white and fluffy.'},
      {i:'🌾', t:'I live on a farm.'},
      {i:'🔊', t:"I say 'baa'!"},
      {i:'🦵', t:'I have four legs.'},
    ],
    hint: 'My name starts with the letter <strong>S</strong>!',
    answers: ['sheep','a sheep'],
    shape: drawSheep,
  },
  {
    n: 5, animal: 'Fish', emoji: '🐟',
    color: '#2176AE', light: '#e3f2fd', dark: '#185a8a',
    clues: [
      {i:'💧', t:'I live in the water.'},
      {i:'🏊', t:'I can swim very fast.'},
      {i:'🔵', t:'I am blue and silver.'},
      {i:'🐠', t:'I have fins and a tail.'},
    ],
    hint: 'My name starts with the letter <strong>F</strong>!',
    answers: ['fish','a fish'],
    shape: drawFish,
  },
];

// Detect station from URL param ?s=N
const params = new URLSearchParams(location.search);
const sIdx = Math.min(Math.max((parseInt(params.get('s') || '1') - 1), 0), 4);
const st = STATIONS[sIdx];

// Apply colors
document.documentElement.style.setProperty('--c', st.color);
document.documentElement.style.setProperty('--cl', st.light);
document.documentElement.style.setProperty('--cd', st.dark);

// Station badge
document.getElementById('stNum').textContent = st.n;
document.getElementById('stLabel').textContent = `Station ${st.n} of 5`;

// Progress stars
for (let i = 0; i < st.n; i++) document.getElementById('s'+i).classList.add('on');

// Clue lines
const linesDiv = document.getElementById('linesDiv');
st.clues.forEach(c => {
  const d = document.createElement('div');
  d.className = 'line';
  d.innerHTML = `<span class="line-ico">${c.i}</span>${c.t}`;
  linesDiv.appendChild(d);
});

// Hint text
document.getElementById('hintBox').innerHTML = '💡 Extra clue: ' + st.hint;

// Draw silhouette
const svg = document.getElementById('silSvg');
st.shape(svg, '#2a2a2a');

// Input logic
let fails = 0;
const input = document.getElementById('ansInput');
input.addEventListener('keydown', e => {
  if (e.key === 'Enter') check();
  input.classList.remove('err');
  document.getElementById('failBanner').classList.remove('show');
});

function check() {
  const val = input.value.trim().toLowerCase().replace(/[^a-z ]/g,'');
  if (!val) return;
  if (st.answers.includes(val)) {
    input.classList.add('ok');
    document.getElementById('checkBtn').disabled = true;
    revealAnimal();
    setTimeout(() => {
      confetti();
      document.getElementById('ovEmoji').textContent = st.emoji;
      document.getElementById('ovSub').innerHTML = `You found the <strong>${st.animal}</strong>! 🎉<br>Collect your animal card!`;
      document.getElementById('overlay').classList.add('show');
    }, 600);
  } else {
    fails++;
    input.classList.add('err');
    document.getElementById('failBanner').classList.add('show');
    if (fails >= 2) document.getElementById('hintBox').classList.add('show');
    setTimeout(() => { input.classList.remove('err'); input.value = ''; input.focus(); }, 500);
  }
}

function revealAnimal() {
  svg.querySelectorAll('[data-body]').forEach((el, i) => {
    setTimeout(() => {
      el.style.transition = 'fill 0.5s';
      el.setAttribute('fill', st.color);
    }, i * 35);
  });
  const qm = svg.querySelector('[data-qm]');
  if (qm) qm.style.opacity = '0';
}

// ──── SVG silhouette drawers ────

function drawHorse(svg, fill) {
  svg.innerHTML = `
    <ellipse data-body cx="80" cy="100" rx="48" ry="28" fill="${fill}"/>
    <circle data-body cx="118" cy="80" r="22" fill="${fill}"/>
    <ellipse data-body cx="128" cy="65" rx="10" ry="24" fill="${fill}" transform="rotate(-20 128 65)"/>
    <rect data-body x="48" y="120" width="12" height="26" rx="5" fill="${fill}"/>
    <rect data-body x="68" y="122" width="12" height="26" rx="5" fill="${fill}"/>
    <rect data-body x="90" y="122" width="12" height="26" rx="5" fill="${fill}"/>
    <rect data-body x="108" y="120" width="12" height="26" rx="5" fill="${fill}"/>
    <path data-body d="M35 80 Q25 55 38 70 Q30 50 45 68 Q38 48 52 72 Z" fill="${fill}"/>
    <circle cx="122" cy="75" r="3" fill="white" data-body/><circle cx="123" cy="75" r="1.5" fill="#333" data-body/>
    <circle cx="132" cy="75" r="3" fill="white" data-body/><circle cx="133" cy="75" r="1.5" fill="#333" data-body/>
    <text data-qm x="80" y="108" text-anchor="middle" font-family="Fredoka One,sans-serif" font-size="40" fill="white" opacity="0.45">?</text>
  `;
}

function drawTiger(svg, fill) {
  svg.innerHTML = `
    <ellipse data-body cx="80" cy="102" rx="50" ry="30" fill="${fill}"/>
    <circle data-body cx="80" cy="72" r="30" fill="${fill}"/>
    <path data-body d="M60 55 L52 30 L72 52 Z" fill="${fill}"/>
    <path data-body d="M100 55 L108 30 L88 52 Z" fill="${fill}"/>
    <rect data-body x="50" y="125" width="13" height="24" rx="5" fill="${fill}"/>
    <rect data-body x="72" y="128" width="13" height="24" rx="5" fill="${fill}"/>
    <rect data-body x="94" y="128" width="13" height="24" rx="5" fill="${fill}"/>
    <rect data-body x="115" y="125" width="13" height="24" rx="5" fill="${fill}"/>
    <circle cx="70" cy="70" r="4" fill="white" data-body/><circle cx="71" cy="70" r="2" fill="#333" data-body/>
    <circle cx="90" cy="70" r="4" fill="white" data-body/><circle cx="91" cy="70" r="2" fill="#333" data-body/>
    <text data-qm x="80" y="110" text-anchor="middle" font-family="Fredoka One,sans-serif" font-size="40" fill="white" opacity="0.45">?</text>
  `;
}

function drawParrot(svg, fill) {
  svg.innerHTML = `
    <ellipse data-body cx="80" cy="100" rx="30" ry="40" fill="${fill}"/>
    <circle data-body cx="80" cy="58" r="26" fill="${fill}"/>
    <path data-body d="M80 30 L65 8 L95 8 Z" fill="${fill}"/>
    <path data-body d="M50 80 Q18 65 20 95 Q22 118 52 108 Z" fill="${fill}"/>
    <path data-body d="M110 80 Q142 65 140 95 Q138 118 108 108 Z" fill="${fill}"/>
    <path data-body d="M68 110 Q80 145 92 110" fill="${fill}" stroke="${fill}" stroke-width="8" stroke-linecap="round"/>
    <circle cx="73" cy="56" r="4" fill="white" data-body/><circle cx="74" cy="56" r="2" fill="#333" data-body/>
    <circle cx="87" cy="56" r="4" fill="white" data-body/><circle cx="88" cy="56" r="2" fill="#333" data-body/>
    <text data-qm x="80" y="108" text-anchor="middle" font-family="Fredoka One,sans-serif" font-size="36" fill="white" opacity="0.45">?</text>
  `;
}

function drawSheep(svg, fill) {
  svg.innerHTML = `
    <ellipse data-body cx="80" cy="100" rx="52" ry="38" fill="${fill}"/>
    <circle data-body cx="50" cy="85" r="22" fill="${fill}"/>
    <circle data-body cx="80" cy="78" r="24" fill="${fill}"/>
    <circle data-body cx="110" cy="85" r="22" fill="${fill}"/>
    <circle data-body cx="65" cy="95" r="20" fill="${fill}"/>
    <circle data-body cx="95" cy="95" r="20" fill="${fill}"/>
    <circle data-body cx="120" cy="72" r="18" fill="${fill}"/>
    <rect data-body x="50" y="130" width="12" height="22" rx="5" fill="${fill}"/>
    <rect data-body x="70" y="132" width="12" height="22" rx="5" fill="${fill}"/>
    <rect data-body x="90" y="132" width="12" height="22" rx="5" fill="${fill}"/>
    <rect data-body x="110" y="130" width="12" height="22" rx="5" fill="${fill}"/>
    <circle data-body cx="120" cy="72" r="16" fill="${fill}"/>
    <circle cx="115" cy="70" r="3.5" fill="white" data-body/><circle cx="116" cy="70" r="2" fill="#333" data-body/>
    <circle cx="127" cy="70" r="3.5" fill="white" data-body/><circle cx="128" cy="70" r="2" fill="#333" data-body/>
    <text data-qm x="78" y="108" text-anchor="middle" font-family="Fredoka One,sans-serif" font-size="36" fill="white" opacity="0.45">?</text>
  `;
}

function drawFish(svg, fill) {
  svg.innerHTML = `
    <ellipse data-body cx="75" cy="88" rx="52" ry="32" fill="${fill}"/>
    <path data-body d="M125 65 L148 45 L148 132 L125 110 Z" fill="${fill}"/>
    <path data-body d="M30 88 L10 62 L10 115 Z" fill="${fill}"/>
    <path data-body d="M65 60 Q80 48 95 60" stroke="${fill}" stroke-width="12" fill="none" stroke-linecap="round" data-body/>
    <path data-body d="M65 116 Q80 128 95 116" stroke="${fill}" stroke-width="12" fill="none" stroke-linecap="round" data-body/>
    <circle cx="36" cy="85" r="5" fill="white" data-body/><circle cx="37" cy="85" r="2.5" fill="#333" data-body/>
    <text data-qm x="75" y="96" text-anchor="middle" font-family="Fredoka One,sans-serif" font-size="36" fill="white" opacity="0.45">?</text>
  `;
}

// ──── Confetti ────
function confetti() {
  const cv = document.getElementById('confetti');
  const ctx = cv.getContext('2d');
  cv.width = innerWidth; cv.height = innerHeight;
  const P = Array.from({length:80}, () => ({
    x: Math.random()*cv.width, y: -20,
    vy: 2+Math.random()*4, vx: (Math.random()-.5)*3,
    rot: Math.random()*Math.PI*2, rv: (Math.random()-.5)*.15,
    s: 12+Math.random()*16,
    c: ['#1A6B3C','#7FB069','#D4AF37',st.color,'#fff'][Math.floor(Math.random()*5)],
    t: Math.random()>.5?'star':'dot', a: 1
  }));
  let f=0;
  (function tick(){
    ctx.clearRect(0,0,cv.width,cv.height);
    P.forEach(p=>{
      p.y+=p.vy; p.x+=p.vx; p.rot+=p.rv;
      if(f>80) p.a-=.013;
      ctx.globalAlpha=Math.max(0,p.a);
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.c;
      if(p.t==='star'){star(ctx,0,0,5,p.s/2,p.s/4);}
      else{ctx.beginPath();ctx.arc(0,0,p.s/2,0,Math.PI*2);ctx.fill();}
      ctx.restore();
    });
    ctx.globalAlpha=1; f++;
    if(f<160) requestAnimationFrame(tick);
    else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}
function star(ctx,cx,cy,sp,or,ir){
  ctx.beginPath();
  for(let i=0;i<sp*2;i++){
    const r=i%2===0?or:ir, a=(i*Math.PI)/sp-Math.PI/2;
    i===0?ctx.moveTo(cx+r*Math.cos(a),cy+r*Math.sin(a)):ctx.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a));
  }
  ctx.closePath(); ctx.fill();
}
