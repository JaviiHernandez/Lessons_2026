<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Eco House Hunt — Room Badges</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#2d2d2d;
    font-family:'Fredoka',sans-serif;
    padding:40px;
    display:flex; flex-direction:column; align-items:center; gap:0;
  }
  h1 { color:white; font-family:'Fredoka One',cursive; font-size:20px; opacity:0.6; margin-bottom:24px; }
  .row { display:flex; gap:20px; margin-bottom:24px; align-items:flex-start; }
  .col-label { color:rgba(255,255,255,0.4); font-family:'Fredoka One',cursive; font-size:13px; writing-mode:vertical-rl; text-orientation:mixed; transform:rotate(180deg); letter-spacing:2px; text-transform:uppercase; align-self:center; margin-right:-4px; }

  .card { width:238px; height:332px; border-radius:18px; position:relative; overflow:hidden; box-shadow:0 8px 24px rgba(0,0,0,0.4); flex-shrink:0; }

  /* FRONT */
  .card-front { display:flex; flex-direction:column; align-items:center; height:100%; }
  .card-header { width:100%; padding:12px 14px 8px; display:flex; align-items:center; justify-content:space-between; }
  .card-room-num { font-family:'Fredoka One',cursive; font-size:11px; color:rgba(255,255,255,0.75); letter-spacing:1.5px; text-transform:uppercase; }
  .card-eco-icons { font-size:13px; letter-spacing:2px; opacity:0.7; }
  .card-emoji-area { flex:1; width:100%; display:flex; align-items:center; justify-content:center; position:relative; }
  .card-emoji { font-size:90px; filter:drop-shadow(0 6px 16px rgba(0,0,0,0.3)); position:relative; z-index:2; }
  .emoji-glow { width:130px; height:130px; background:rgba(255,255,255,0.12); border-radius:50%; position:absolute; border:2px solid rgba(255,255,255,0.2); }
  .card-footer { width:100%; padding:10px 14px 14px; text-align:center; background:rgba(0,0,0,0.18); }
  .card-room-name { font-family:'Fredoka One',cursive; font-size:22px; color:white; text-shadow:0 2px 8px rgba(0,0,0,0.3); margin-bottom:2px; }
  .card-subtitle { font-size:11px; color:rgba(255,255,255,0.7); font-weight:600; letter-spacing:1px; text-transform:uppercase; }

  .eco-border { position:absolute; inset:6px; border:2.5px solid rgba(249,168,37,0.7); border-radius:13px; pointer-events:none; z-index:10; }
  .eco-border::before { content:'🌿'; position:absolute; top:-8px; left:50%; transform:translateX(-50%); font-size:14px; }
  .corner-gem { position:absolute; width:10px; height:10px; background:#F9A825; border-radius:50%; z-index:11; }

  /* BACK */
  .card-back { display:flex; flex-direction:column; height:100%; }
  .back-header { padding:10px 12px 4px; text-align:center; }
  .back-title { font-family:'Fredoka One',cursive; font-size:14px; color:white; margin-bottom:0; }
  .back-emoji { font-size:22px; line-height:1; }
  .back-body { flex:1; background:white; margin:6px 10px 10px; border-radius:12px; padding:10px 10px; display:flex; flex-direction:column; gap:6px; justify-content:center; }
  .tip { display:flex; align-items:flex-start; gap:7px; padding:6px 9px; border-radius:9px; font-size:12.5px; font-weight:600; color:#2a2a2a; line-height:1.35; }
  .tip-icon { font-size:16px; flex-shrink:0; margin-top:1px; }

  @media print { body{background:white;padding:20px;} .card{box-shadow:none;} h1{display:none;} .col-label{display:none;} }
</style>
</head>
<body>
<h1>🏅 Eco Room Badges — Print on cardstock, cut out</h1>

<script>
const rooms = [
  {
    n:1, name:'Living Room', emoji:'🛋️', color:'#C62828', dark:'#8b1a1a',
    tips:[
      {i:'💡', t:"It's daytime! Turn off the lights. Use sunlight — it's free!"},
      {i:'📺', t:'Turn off the TV when nobody is watching. Save energy!'},
      {i:'🔌', t:'Unplug devices when not in use. They waste energy too!'},
    ]
  },
  {
    n:2, name:'Bedroom', emoji:'🛏️', color:'#6A1B9A', dark:'#4a0e6e',
    tips:[
      {i:'💡', t:'Turn off the lamp when you leave the room. Save energy!'},
      {i:'🔌', t:'Unplug your charger when the computer is full!'},
      {i:'🌞', t:'Open the windows and use natural light during the day!'},
    ]
  },
  {
    n:3, name:'Bathroom', emoji:'🚿', color:'#0277BD', dark:'#01487a',
    tips:[
      {i:'🚰', t:'Turn off the tap when you brush your teeth. Save water!'},
      {i:'🚿', t:'Take short showers — 5 minutes is enough!'},
      {i:'💧', t:'Every drop counts! Don\'t waste water!'},
    ]
  },
  {
    n:4, name:'Garden', emoji:'🌻', color:'#2E7D32', dark:'#1b5e20',
    tips:[
      {i:'🪣', t:'Use a rain bucket to water your plants. Save water!'},
      {i:'🌺', t:'Plant flowers for bees! They help our planet.'},
      {i:'☀️', t:'Let the sun dry your clothes!'},
    ]
  },
  {
    n:5, name:'Kitchen', emoji:'🍳', color:'#E64A19', dark:'#a33612',
    tips:[
      {i:'🧊', t:'Close the fridge door! It wastes a lot of electrical energy!'},
      {i:'🚰', t:'Turn off the tap after washing the dishes!'},
      {i:'🌍', t:'Only take what you can eat — your tummy is smaller than your eyes!'},
    ]
  },
];

rooms.forEach(r => {
  document.write(`
  <div class="row">
    <div class="col-label">Front</div>
    <div class="card" style="background:linear-gradient(150deg,${r.color} 0%,${r.dark} 100%);">
      <div class="eco-border">
        <div class="corner-gem" style="top:-3px;left:-3px;"></div>
        <div class="corner-gem" style="top:-3px;right:-3px;"></div>
        <div class="corner-gem" style="bottom:-3px;left:-3px;"></div>
        <div class="corner-gem" style="bottom:-3px;right:-3px;"></div>
      </div>
      <div class="card-front">
        <div class="card-header">
          <div class="card-room-num">Room ${r.n}</div>
          <div class="card-eco-icons">🌿♻️💧</div>
        </div>
        <div class="card-emoji-area">
          <div class="emoji-glow"></div>
          <div class="card-emoji">${r.emoji}</div>
        </div>
        <div class="card-footer">
          <div class="card-room-name">${r.name}</div>
          <div class="card-subtitle">&nbsp;</div>
        </div>
      </div>
    </div>

    <div class="col-label" style="margin-left:8px;margin-right:-4px;">Back</div>
    <div class="card" style="background:linear-gradient(150deg,${r.dark} 0%,${r.color} 100%);">
      <div class="eco-border">
        <div class="corner-gem" style="top:-3px;left:-3px;"></div>
        <div class="corner-gem" style="top:-3px;right:-3px;"></div>
        <div class="corner-gem" style="bottom:-3px;left:-3px;"></div>
        <div class="corner-gem" style="bottom:-3px;right:-3px;"></div>
      </div>
      <div class="card-back">
        <div class="back-header">
          <div class="back-emoji">${r.emoji}</div>
          <div class="back-title">${r.name} — Eco Tips!</div>
        </div>
        <div class="back-body">
          ${r.tips.map(t=>`
          <div class="tip" style="background:${hexRgba(r.color,0.1)}">
            <span class="tip-icon">${t.i}</span>${t.t}
          </div>`).join('')}
        </div>
      </div>
    </div>
  </div>
  `);
});

function hexRgba(hex,a){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}
</script>
<script>/* auto-print on ?print=1 */if(new URLSearchParams(location.search).get("print")==="1"){window.addEventListener("load",function(){setTimeout(function(){window.print();},700);});}</script></body>
</html>
