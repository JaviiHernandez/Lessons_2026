<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#1a1a1a; font-family:'Fredoka',sans-serif; color:#f5f5f5; }
  .riddle-bar {
    padding:24px 20px;
    background:#222;
    border-bottom:1px solid #333;
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    justify-content:center;
    align-items:center;
  }
  .riddle-bar .label {
    font-weight:600;
    color:#bdbdbd;
    margin-right:8px;
    font-size:0.95rem;
  }
  .riddle-bar a {
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:8px 14px;
    background:#2d2d2d;
    border:1px solid #444;
    border-radius:999px;
    color:#f5f5f5;

  }

</style>
<style id="dl-all-style">
  .dl-all-btn {
    background: linear-gradient(135deg, #C62828, #F9A825);
    color: white !important;
    font-family: 'Fredoka One', sans-serif;
    font-size: 13px;
    text-decoration: none;
    padding: 8px 16px;
    border-radius: 8px;
    margin: 0 6px;
    white-space: nowrap;
    flex-shrink: 0;
    cursor: pointer;
    border: 2px solid rgba(255,255,255,0.18);
    transition: filter .15s, transform .12s;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .dl-all-btn:hover { filter: brightness(1.12); transform: translateY(-1px); }
  .dl-all-btn:active { transform: translateY(0); }
</style>
<script id="dl-all-script">
function downloadAllPrintables(){
  var P=[{u:'poster.html',s:'A3'},{u:'team-board.html',s:'A4'},{u:'qr-cards.html',s:'A5'},{u:'room-cards.html',s:'A4'},{u:'medal.html',s:'A4'},{u:'diploma.html',s:'A4'},{u:'teacher-guide.html',s:'2xA4'}];
  if(!confirm('This will generate '+P.length+' PDFs and bundle them into a single ZIP ("Lesson2_Printables.zip").\nGeneration takes ~60 seconds. Continue?')) return;
  // Hidden host for the iframes (off-screen, large enough for html2canvas to measure correctly)
  var host=document.createElement('div');
  host.id='dl-all-host';
  host.style.cssText='position:fixed;top:-99999px;left:-99999px;width:0;height:0;overflow:hidden;pointer-events:none;';
  document.body.appendChild(host);
  // Toast
  var toast=document.createElement('div');
  toast.style.cssText='position:fixed;bottom:20px;right:20px;background:#1a1a1a;color:#F9A825;font-family:Fredoka,sans-serif;padding:14px 20px;border-radius:10px;border:2px solid #F9A825;box-shadow:0 8px 24px rgba(0,0,0,0.6);z-index:99999;font-size:14px;font-weight:600;max-width:340px;';
  toast.innerHTML='<div>📦 Building ZIP of printables...</div><div id="dl-all-progress" style="font-size:12px;font-weight:400;color:#bdbdbd;margin-top:6px;">Loading JSZip…</div>';
  document.body.appendChild(toast);
  function setProgress(t){var el=document.getElementById('dl-all-progress');if(el)el.textContent=t;}
  function cleanup(){try{host.remove();toast.remove();}catch(e){}}

  // Load JSZip
  function loadJSZip(){
    return new Promise(function(resolve,reject){
      if(typeof JSZip!=='undefined') return resolve();
      var s=document.createElement('script');
      s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
      s.crossOrigin='anonymous';
      s.onload=resolve;
      s.onerror=function(){reject(new Error('Failed to load JSZip'));};
      document.head.appendChild(s);
    });
  }

  loadJSZip().then(function(){
    var zip=new JSZip();
    var collected=0;
    var pdfFor={}; // expected filename per index, used for timeout fallback
    var doneFor={}; // marks indices that have been resolved
    var resolveAll;
    var done=new Promise(function(res){resolveAll=res;});

    function handleMessage(e){
      var d=e.data;
      if(!d||typeof d!=='object') return;
      if(d.type==='pdf-blob'&&d.name&&d.blob){
        zip.file(d.name,d.blob);
        collected++;
        setProgress('Collected '+collected+'/'+P.length+' (last: '+d.name+')');
      } else if(d.type==='pdf-error'){
        console.warn('[DL-ALL] iframe error:',d.error);
      }
    }
    window.addEventListener('message',handleMessage);

    // Spawn iframes one by one, 11s apart
    var idx=0;
    function spawn(){
      if(idx>=P.length){
        // Wait a bit for last message, then build ZIP
        setProgress('Finalising ZIP…');
        setTimeout(function(){
          window.removeEventListener('message',handleMessage);
          if(collected===0){
            cleanup();
            alert('Could not collect any PDF. The lesson page must be served (not opened from file://) so the iframes can load. Open the page through the local server / deployed site and try again.');
            return;
          }
          zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}}).then(function(content){
            var url=URL.createObjectURL(content);
            var a=document.createElement('a');
            a.href=url; a.download='Lesson2_Printables.zip';
            document.body.appendChild(a); a.click();
            setTimeout(function(){URL.revokeObjectURL(url);a.remove();},1000);
            setProgress('✅ Downloaded Lesson2_Printables.zip ('+collected+'/'+P.length+' PDFs)');
            setTimeout(cleanup,5000);
          }).catch(function(err){
            cleanup();
            alert('Could not build ZIP: '+(err.message||err));
          });
        }, 4000);
        return;
      }
      var it=P[idx];
      setProgress('Generating '+(idx+1)+'/'+P.length+': '+it.u);
      var iframe=document.createElement('iframe');
      iframe.src=it.u+'?pdf=1&dlall=1&size='+encodeURIComponent(it.s);
      iframe.style.cssText='width:1100px;height:1500px;border:0;';
      host.appendChild(iframe);
      // After 11s, kill the iframe and move on (gives time for emoji preload + render + postMessage)
      setTimeout(function(){
        try{iframe.remove();}catch(e){}
        idx++;
        spawn();
      },11000);
    }
    spawn();
  }).catch(function(err){
    cleanup();
    alert('Could not load JSZip: '+(err.message||err));
  });
}
</script>
</head>
<body>
<nav class="riddle-bar">
  <span class="label">🧩 Direct riddles:</span>
  <a href="riddle.html?s=1" target="_blank" rel="noopener">🛋️ Living Room</a>
  <a href="riddle.html?s=2" target="_blank" rel="noopener">🛏️ Bedroom</a>
  <a href="riddle.html?s=3" target="_blank" rel="noopener">🚿 Bathroom</a>
  <a href="riddle.html?s=4" target="_blank" rel="noopener">🌻 Garden</a>
  <a href="riddle.html?s=5" target="_blank" rel="noopener">🍳 Kitchen</a>
<a class="dl-all-btn" href="#" onclick="event.preventDefault();downloadAllPrintables();return false;" title="Open one tab per printable; each downloads its own PDF">📦 Download all PDFs</a></nav>
<div id="root"></div>
<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard } = window;

function Frame({ src, width, height }) {
  return (
    <iframe
      src={src}
      style={{ width, height, border:'none', display:'block' }}
      scrolling="no"
      title={src}
    />
  );
}

function App() {
  return (
    <DesignCanvas title="🏠 Eco House Hunt — Lesson 2: Parts of the House">

      <DCSection id="print1" title="Printable Classroom Materials">
        <DCArtboard id="poster" label="Intro Poster (A3)" width={794} height={1123}
          download="poster.html" downloadFormat="A3">
          <Frame src="poster.html" width={794} height={1123} />
        </DCArtboard>
        <DCArtboard id="board" label="Team Board (A4)" width={794} height={1123}
          download="team-board.html" downloadFormat="A4">
          <Frame src="team-board.html" width={794} height={1123} />
        </DCArtboard>
        <DCArtboard id="qrcards" label="QR Station Cards (A5 × 5)" width={600} height={3000}
          download="qr-cards.html" downloadFormat="A5">
          <Frame src="qr-cards.html" width={600} height={3000} />
        </DCArtboard>
      </DCSection>

      <DCSection id="riddles" title="Interactive Room Riddles (open each in new tab for full experience)">
        <DCArtboard id="r1" label="Room 1 — Living Room 🛋️" width={800} height={600}>
          <Frame src="riddle.html?s=1" width={800} height={600} />
        </DCArtboard>
        <DCArtboard id="r2" label="Room 2 — Bedroom 🛏️" width={800} height={600}>
          <Frame src="riddle.html?s=2" width={800} height={600} />
        </DCArtboard>
        <DCArtboard id="r3" label="Room 3 — Bathroom 🚿" width={800} height={600}>
          <Frame src="riddle.html?s=3" width={800} height={600} />
        </DCArtboard>
        <DCArtboard id="r4" label="Room 4 — Garden 🌻" width={800} height={600}>
          <Frame src="riddle.html?s=4" width={800} height={600} />
        </DCArtboard>
        <DCArtboard id="r5" label="Room 5 — Kitchen 🍳" width={800} height={600}>
          <Frame src="riddle.html?s=5" width={800} height={600} />
        </DCArtboard>
      </DCSection>

      <DCSection id="cards" title="Collectible Room Badges">
        <DCArtboard id="roomcards" label="All 5 Badges — Front & Back" width={640} height={1940}
          download="room-cards.html" downloadFormat="A4">
          <Frame src="room-cards.html" width={640} height={1940} />
        </DCArtboard>
      </DCSection>

      <DCSection id="rewards" title="Rewards & Teacher Materials">
        <DCArtboard id="medal" label="Medals (All 5 Roles)" width={900} height={560}
          download="medal.html" downloadFormat="A4">
          <Frame src="medal.html" width={900} height={560} />
        </DCArtboard>
        <DCArtboard id="diploma" label="Diploma (A4)" width={794} height={1123}
          download="diploma.html" downloadFormat="A4">
          <Frame src="diploma.html" width={794} height={1123} />
        </DCArtboard>
        <DCArtboard id="guide" label="Teacher's Guide (2 pages)" width={874} height={2700}
          download="teacher-guide.html" downloadFormat="2×A4">
          <Frame src="teacher-guide.html" width={874} height={2700} />
        </DCArtboard>
      </DCSection>

    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
