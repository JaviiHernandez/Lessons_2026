<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eco House Hunt — All Materials</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#1a1a1a; font-family:'Fredoka',sans-serif; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard } = window;

function Frame({ src, width, height }) {
  return (
    <iframe
      src={src}
      style={{ width, height, border:'none', display:'block' }}
      scrolling="no"
      title={src}
    />
  );
}

function App() {
  return (
    <DesignCanvas title="🏠 Eco House Hunt — Lesson 2: Parts of the House">

      <DCSection id="print1" title="Printable Classroom Materials">
        <DCArtboard id="poster" label="Intro Poster (A3)" width={794} height={1123}>
          <Frame src="poster.html" width={794} height={1123} />
        </DCArtboard>
        <DCArtboard id="board" label="Team Board (A4)" width={794} height={1123}>
          <Frame src="team-board.html" width={794} height={1123} />
        </DCArtboard>
        <DCArtboard id="qrcards" label="QR Station Cards (A5 × 5)" width={600} height={3000}>
          <Frame src="qr-cards.html" width={600} height={3000} />
        </DCArtboard>
      </DCSection>

      <DCSection id="riddles" title="Interactive Room Riddles (open each in new tab for full experience)">
        <DCArtboard id="r1" label="Room 1 — Living Room 🛋️" width={800} height={600}>
          <Frame src="riddle.html?s=1" width={800} height={600} />
        </DCArtboard>
        <DCArtboard id="r2" label="Room 2 — Bedroom 🛏️" width={800} height={600}>
          <Frame src="riddle.html?s=2" width={800} height={600} />
        </DCArtboard>
        <DCArtboard id="r3" label="Room 3 — Bathroom 🚿" width={800} height={600}>
          <Frame src="riddle.html?s=3" width={800} height={600} />
        </DCArtboard>
        <DCArtboard id="r4" label="Room 4 — Garden 🌻" width={800} height={600}>
          <Frame src="riddle.html?s=4" width={800} height={600} />
        </DCArtboard>
        <DCArtboard id="r5" label="Room 5 — Kitchen 🍳" width={800} height={600}>
          <Frame src="riddle.html?s=5" width={800} height={600} />
        </DCArtboard>
      </DCSection>

      <DCSection id="cards" title="Collectible Room Badges">
        <DCArtboard id="roomcards" label="All 5 Badges — Front & Back" width={640} height={1940}>
          <Frame src="room-cards.html" width={640} height={1940} />
        </DCArtboard>
      </DCSection>

      <DCSection id="rewards" title="Rewards & Teacher Materials">
        <DCArtboard id="medal" label="Medals (All 5 Roles)" width={900} height={560}>
          <Frame src="medal.html" width={900} height={560} />
        </DCArtboard>
        <DCArtboard id="diploma" label="Diploma (A4)" width={794} height={1123}>
          <Frame src="diploma.html" width={794} height={1123} />
        </DCArtboard>
        <DCArtboard id="guide" label="Teacher's Guide (2 pages)" width={874} height={2700}>
          <Frame src="teacher-guide.html" width={874} height={2700} />
        </DCArtboard>
      </DCSection>

    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
