<style id="dl-all-style">
  .dl-all-btn {
    background: linear-gradient(135deg, #E65100, #F9A825);
    color: white !important;
    font-family: 'Fredoka One', sans-serif;
    font-size: 13px;
    text-decoration: none;
    padding: 8px 16px;
    border-radius: 8px;
    margin: 0 6px;
    white-space: nowrap;
    flex-shrink: 0;
    cursor: pointer;
    border: 2px solid rgba(255,255,255,0.18);
    transition: filter .15s, transform .12s;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .dl-all-btn:hover { filter: brightness(1.12); transform: translateY(-1px); }
  .dl-all-btn:active { transform: translateY(0); }
</style>
<script id="dl-all-script">
function downloadAllPrintables(){
  var P=[{u:'poster.html',s:'A3'},{u:'team-board.html',s:'A4'},{u:'qr-cards.html',s:'A4'},{u:'room-cards.html',s:'A4'},{u:'medal.html',s:'A4'},{u:'diploma.html',s:'A4'},{u:'teacher-guide.html',s:'2xA4'}];
  if(!confirm('This will generate '+P.length+' PDFs and bundle them into a single ZIP ("Lesson7_Printables.zip").\nGeneration takes ~60 seconds. Continue?')) return;
  // Hidden host for the iframes (off-screen, large enough for html2canvas to measure correctly)
  var host=document.createElement('div');
  host.id='dl-all-host';
  host.style.cssText='position:fixed;top:-99999px;left:-99999px;width:0;height:0;overflow:hidden;pointer-events:none;';
  document.body.appendChild(host);
  // Toast
  var toast=document.createElement('div');
  toast.style.cssText='position:fixed;bottom:20px;right:20px;background:#1a1a1a;color:#F9A825;font-family:Fredoka,sans-serif;padding:14px 20px;border-radius:10px;border:2px solid #F9A825;box-shadow:0 8px 24px rgba(0,0,0,0.6);z-index:99999;font-size:14px;font-weight:600;max-width:340px;';
  toast.innerHTML='<div>📦 Building ZIP of printables...</div><div id="dl-all-progress" style="font-size:12px;font-weight:400;color:#bdbdbd;margin-top:6px;">Loading JSZip…</div>';
  document.body.appendChild(toast);
  function setProgress(t){var el=document.getElementById('dl-all-progress');if(el)el.textContent=t;}
  function cleanup(){try{host.remove();toast.remove();}catch(e){}}

  // Load JSZip
  function loadJSZip(){
    return new Promise(function(resolve,reject){
      if(typeof JSZip!=='undefined') return resolve();
      var s=document.createElement('script');
      s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
      s.crossOrigin='anonymous';
      s.onload=resolve;
      s.onerror=function(){reject(new Error('Failed to load JSZip'));};
      document.head.appendChild(s);
    });
  }

  loadJSZip().then(function(){
    var zip=new JSZip();
    var collected=0;
    var pdfFor={}; // expected filename per index, used for timeout fallback
    var doneFor={}; // marks indices that have been resolved
    var resolveAll;
    var done=new Promise(function(res){resolveAll=res;});

    function handleMessage(e){
      var d=e.data;
      if(!d||typeof d!=='object') return;
      if(d.type==='pdf-blob'&&d.name&&d.blob){
        zip.file(d.name,d.blob);
        collected++;
        setProgress('Collected '+collected+'/'+P.length+' (last: '+d.name+')');
      } else if(d.type==='pdf-error'){
        console.warn('[DL-ALL] iframe error:',d.error);
      }
    }
    window.addEventListener('message',handleMessage);

    // Spawn iframes one by one, 11s apart
    var idx=0;
    function spawn(){
      if(idx>=P.length){
        // Wait a bit for last message, then build ZIP
        setProgress('Finalising ZIP…');
        setTimeout(function(){
          window.removeEventListener('message',handleMessage);
          if(collected===0){
            cleanup();
            alert('Could not collect any PDF. The lesson page must be served (not opened from file://) so the iframes can load. Open the page through the local server / deployed site and try again.');
            return;
          }
          zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}}).then(function(content){
            var url=URL.createObjectURL(content);
            var a=document.createElement('a');
            a.href=url; a.download='Lesson7_Printables.zip';
            document.body.appendChild(a); a.click();
            setTimeout(function(){URL.revokeObjectURL(url);a.remove();},1000);
            setProgress('✅ Downloaded Lesson7_Printables.zip ('+collected+'/'+P.length+' PDFs)');
            setTimeout(cleanup,5000);
          }).catch(function(err){
            cleanup();
            alert('Could not build ZIP: '+(err.message||err));
          });
        }, 4000);
        return;
      }
      var it=P[idx];
      setProgress('Generating '+(idx+1)+'/'+P.length+': '+it.u);
      var iframe=document.createElement('iframe');
      iframe.src=it.u+'?pdf=1&dlall=1&size='+encodeURIComponent(it.s);
      iframe.style.cssText='width:1100px;height:1500px;border:0;';
      host.appendChild(iframe);
      // After 11s, kill the iframe and move on (gives time for emoji preload + render + postMessage)
      setTimeout(function(){
        try{iframe.remove();}catch(e){}
        idx++;
        spawn();
      },11000);
    }
    spawn();
  }).catch(function(err){
    cleanup();
    alert('Could not load JSZip: '+(err.message||err));
  });
}
</script>
</head>
<body>

<script type="text/babel">
const IFRAME_STYLE = {
  border: 'none',
  display: 'block',
  width: '100%',
  height: '100%',
};

function PageFrame({ src, width, height }) {
  return (
    <iframe
      src={src}
      title={src}
      style={{ ...IFRAME_STYLE, width, height }}
      loading="lazy"
    />
  );
}

function App() {
  return (
    <DesignCanvas>

      {/* ── Section 1: Printable Classroom Materials ── */}
      <DCSection
        id="printables"
        title="🖨️ Printable Classroom Materials"
        subtitle="Open individually in browser · Cmd+P / Ctrl+P to print at correct size"
      >
        <DCArtboard id="poster" label="poster.html — Intro Poster (A3)" width={560} height={800}
          download="poster.html" downloadFormat="A3">
          <PageFrame src="poster.html" width={560} height={800} />
        </DCArtboard>

        <DCArtboard id="team-board" label="team-board.html — Team Board (A4)" width={560} height={720}
          download="team-board.html" downloadFormat="A4">
          <PageFrame src="team-board.html" width={560} height={720} />
        </DCArtboard>

        <DCArtboard id="qr-cards" label="qr-cards.html — 5 QR Station Cards (A4 landscape)" width={560} height={760}
          download="qr-cards.html" downloadFormat="A4">
          <PageFrame src="qr-cards.html" width={560} height={760} />
        </DCArtboard>
      </DCSection>

      {/* ── Section 2: Interactive Non-teachy Hobby Riddles ── */}
      <DCSection
        id="riddles"
        title="🏕️ Interactive Non-teachy Hobby Riddles"
        subtitle="Mobile-first · Open on tablets/phones in the classroom · Use ?s=1 through ?s=5"
      >
        <DCArtboard id="r1" label="Spot 1 — Music Camp 🎸" width={375} height={680}>
          <PageFrame src="riddle.html?s=1" width={375} height={680} />
        </DCArtboard>

        <DCArtboard id="r2" label="Spot 2 — Campsite ⛺" width={375} height={680}>
          <PageFrame src="riddle.html?s=2" width={375} height={680} />
        </DCArtboard>

        <DCArtboard id="r3" label="Spot 3 — Camp Kitchen 🥄" width={375} height={680}>
          <PageFrame src="riddle.html?s=3" width={375} height={680} />
        </DCArtboard>

        <DCArtboard id="r4" label="Spot 4 — Reading Cabin 📚" width={375} height={680}>
          <PageFrame src="riddle.html?s=4" width={375} height={680} />
        </DCArtboard>

        <DCArtboard id="r5" label="Spot 5 — Garden Patch 🌱" width={375} height={680}>
          <PageFrame src="riddle.html?s=5" width={375} height={680} />
        </DCArtboard>
      </DCSection>

      {/* ── Section 3: Collectible Fun Fact Cards ── */}
      <DCSection
        id="cards"
        title="🃏 Collectible Fun Fact Cards"
        subtitle="Print on cardstock · Cut out · Hand to teams when they discover each hobby"
      >
        <DCArtboard id="room-cards" label="room-cards.html — 5 Fun Fact Cards (front + back)" width={600} height={780}
          download="room-cards.html" downloadFormat="A4">
          <PageFrame src="room-cards.html" width={600} height={780} />
        </DCArtboard>
      </DCSection>

      {/* ── Section 4: Rewards & Teacher Materials ── */}
      <DCSection
        id="rewards"
        title="🏆 Rewards &amp; Teacher Materials"
        subtitle="Medals · Diploma · Teacher Guide — print at end of session"
      >
        <DCArtboard id="medal" label="medal.html — 5 Role Medals" width={500} height={560}
          download="medal.html" downloadFormat="A4">
          <PageFrame src="medal.html" width={500} height={560} />
        </DCArtboard>

        <DCArtboard id="diploma" label="diploma.html — Non-teachy Hobbies Scout Diploma (A4)" width={560} height={720}
          download="diploma.html" downloadFormat="A4">
          <PageFrame src="diploma.html" width={560} height={720} />
        </DCArtboard>

        <DCArtboard id="teacher-guide" label="teacher-guide.html — Teacher Guide (2 × A4)" width={560} height={900}
          download="teacher-guide.html" downloadFormat="2×A4">
          <PageFrame src="teacher-guide.html" width={560} height={900} />
        </DCArtboard>
      </DCSection>

    </DesignCanvas>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
