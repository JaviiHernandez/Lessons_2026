<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>🔍 Delicious Food Detectives — Lesson 6</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/twemoji@14.0.2/dist/twemoji.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Fredoka', sans-serif;
    background: #1a0f1a;
    overflow: hidden;
    height: 100dvh;
    width: 100vw;
    display: flex;
    flex-direction: column;
  }

  /* ── Top navigation bar ── */
  .top-bar {
    background: linear-gradient(135deg, #1a0f1a, #311B92);
    border-bottom: 3px solid #D32F2F;
    padding: 0 clamp(12px, 2vw, 24px);
    display: flex;
    align-items: center;
    gap: clamp(8px, 1.5vw, 16px);
    flex-shrink: 0;
    height: 52px;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;
  }

  .top-bar::-webkit-scrollbar { display: none; }

  img.emoji {
    height: 1em;
    width: 1em;
    margin: 0 0.05em 0 0.1em;
    vertical-align: -0.1em;
    display: inline-block;
  }

  .bar-brand {
    font-family: 'Fredoka One', sans-serif;
    font-size: clamp(13px, 2vw, 17px);
    color: #F9A825;
    white-space: nowrap;
    flex-shrink: 0;
    text-shadow: 1px 1px 0 rgba(0,0,0,0.3);
    letter-spacing: 0.3px;
  }

  .bar-divider {
    width: 1px;
    height: 24px;
    background: rgba(255,255,255,0.15);
    flex-shrink: 0;
  }

  .riddle-bar {
    display: flex;
    gap: clamp(4px, 0.8vw, 8px);
    align-items: center;
    flex-shrink: 0;
  }

  .riddle-bar-label {
    font-family: 'Fredoka One', sans-serif;
    font-size: clamp(10px, 1.5vw, 12px);
    color: rgba(255,255,255,0.45);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .riddle-link {
    display: flex;
    align-items: center;
    gap: 5px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    padding: 5px 10px;
    text-decoration: none;
    color: rgba(255,255,255,0.85);
    font-family: 'Fredoka One', sans-serif;
    font-size: clamp(10px, 1.4vw, 12px);
    transition: background 0.15s, border-color 0.15s;
    white-space: nowrap;
    flex-shrink: 0;
    min-height: 32px;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  .riddle-link:hover { color: white; }

  .rl1:hover { background: rgba(27,94,32,0.35);   border-color: #66bb6a; }
  .rl2:hover { background: rgba(211,47,47,0.35);  border-color: #ef9a9a; }
  .rl3:hover { background: rgba(46,125,50,0.35);  border-color: #a5d6a7; }
  .rl4:hover { background: rgba(94,53,177,0.35);  border-color: #b39ddb; }
  .rl5:hover { background: rgba(2,136,209,0.35);  border-color: #81d4fa; }

  .bar-spacer { flex: 1; }

  .bar-hint {
    font-size: clamp(9px, 1.3vw, 11px);
    color: rgba(255,255,255,0.28);
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* ── Canvas area ── */
  #root {
    flex: 1;
    overflow: hidden;
    min-height: 0;
  }
</style>
<style id="dl-all-style">
  .dl-all-btn {
    background: linear-gradient(135deg, #C62828, #F9A825);
    color: white !important;
    font-family: 'Fredoka One', sans-serif;
    font-size: 13px;
    text-decoration: none;
    padding: 8px 16px;
    border-radius: 8px;
    margin: 0 6px;
    white-space: nowrap;
    flex-shrink: 0;
    cursor: pointer;
    border: 2px solid rgba(255,255,255,0.18);
    transition: filter .15s, transform .12s;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .dl-all-btn:hover { filter: brightness(1.12); transform: translateY(-1px); }
  .dl-all-btn:active { transform: translateY(0); }
</style>
<script id="dl-all-script">
function downloadAllPrintables(){
  var p=[{u:'poster.html',s:'A3'},{u:'team-board.html',s:'A4'},{u:'qr-cards.html',s:'A5'},{u:'room-cards.html',s:'A4'},{u:'medal.html',s:'A4'},{u:'diploma.html',s:'A4'},{u:'teacher-guide.html',s:'2xA4'}];
  if(!confirm('This will open '+p.length+' tabs to download all printables as PDF.\nMake sure popups are allowed for this site.\nContinue?')) return;
  p.forEach(function(it,i){
    setTimeout(function(){
      var w=window.open(it.u+'?pdf=1&size='+encodeURIComponent(it.s),'_blank');
      if(!w && i===0) alert('Popups blocked. Please allow popups for this site and try again.');
    }, i*1500);
  });
}
</script>
</head>
<body>

<!-- Top navigation bar -->
<div class="top-bar">
  <div class="bar-brand">🔍 Delicious Food Detectives — Lesson 6</div>
  <div class="bar-divider"></div>
  <div class="riddle-bar">
    <div class="riddle-bar-label">Open riddle:</div>
    <a class="riddle-link rl1" href="riddle.html?s=1" target="_blank">🥛 Yoghurt</a>
    <a class="riddle-link rl2" href="riddle.html?s=2" target="_blank">🍗 Chicken</a>
    <a class="riddle-link rl3" href="riddle.html?s=3" target="_blank">🥕 Vegetables</a>
    <a class="riddle-link rl4" href="riddle.html?s=4" target="_blank">🍪 Cookies</a>
    <a class="riddle-link rl5" href="riddle.html?s=5" target="_blank">🐟 Tuna</a>
  </div>
  <a class="dl-all-btn" href="#" onclick="event.preventDefault();downloadAllPrintables();return false;" title="Open one tab per printable; each downloads its own PDF">📦 Download all PDFs</a><div class="bar-spacer"></div>
  <div class="bar-hint">Scroll · Pan · Pinch to zoom</div>
</div>

<div id="root"></div>

<script type="text/babel">
const IFRAME_STYLE = {
  border: 'none',
  display: 'block',
  width: '100%',
  height: '100%',
};

function PageFrame({ src, width, height }) {
  return (
    <iframe
      src={src}
      title={src}
      style={{ ...IFRAME_STYLE, width, height }}
      loading="lazy"
    />
  );
}

function App() {
  return (
    <DesignCanvas>

      {/* ── Section 1: Printable Classroom Materials ── */}
      <DCSection
        id="printables"
        title="🖨️ Printable Classroom Materials"
        subtitle="Open individually in browser · Cmd+P / Ctrl+P to print at correct size"
      >
        <DCArtboard id="poster" label="poster.html — Intro Poster (A3)" width={560} height={800}
          download="poster.html" downloadFormat="A3">
          <PageFrame src="poster.html" width={560} height={800} />
        </DCArtboard>

        <DCArtboard id="team-board" label="team-board.html — Team Board (A4)" width={560} height={720}
          download="team-board.html" downloadFormat="A4">
          <PageFrame src="team-board.html" width={560} height={720} />
        </DCArtboard>

        <DCArtboard id="qr-cards" label="qr-cards.html — 5 QR Station Cards (A5 landscape)" width={560} height={760}
          download="qr-cards.html" downloadFormat="A5">
          <PageFrame src="qr-cards.html" width={560} height={760} />
        </DCArtboard>
      </DCSection>

      {/* ── Section 2: Interactive Food Detective Riddles ── */}
      <DCSection
        id="riddles"
        title="🥗 Interactive Food Detective Riddles"
        subtitle="Mobile-first · Open on tablets/phones in the classroom · Use ?s=1 through ?s=5"
      >
        <DCArtboard id="r1" label="Station 1 — Breakfast Kitchen 🥛" width={375} height={680}>
          <PageFrame src="riddle.html?s=1" width={375} height={680} />
        </DCArtboard>

        <DCArtboard id="r2" label="Station 2 — Farm Kitchen 🍗" width={375} height={680}>
          <PageFrame src="riddle.html?s=2" width={375} height={680} />
        </DCArtboard>

        <DCArtboard id="r3" label="Station 3 — Garden Kitchen 🥕" width={375} height={680}>
          <PageFrame src="riddle.html?s=3" width={375} height={680} />
        </DCArtboard>

        <DCArtboard id="r4" label="Station 4 — Dessert Kitchen 🍪" width={375} height={680}>
          <PageFrame src="riddle.html?s=4" width={375} height={680} />
        </DCArtboard>

        <DCArtboard id="r5" label="Station 5 — Ocean Kitchen 🐟" width={375} height={680}>
          <PageFrame src="riddle.html?s=5" width={375} height={680} />
        </DCArtboard>
      </DCSection>

      {/* ── Section 3: Collectible Character Cards ── */}
      <DCSection
        id="cards"
        title="🃏 Collectible Character Cards"
        subtitle="Print on cardstock · Cut out · Hand to teams when they find each ingredient"
      >
        <DCArtboard id="room-cards" label="room-cards.html — 5 Character Cards (front + back)" width={600} height={780}
          download="room-cards.html" downloadFormat="A4">
          <PageFrame src="room-cards.html" width={600} height={780} />
        </DCArtboard>
      </DCSection>

      {/* ── Section 4: Rewards & Teacher Materials ── */}
      <DCSection
        id="rewards"
        title="🏆 Rewards &amp; Teacher Materials"
        subtitle="Medals · Diploma · Teacher Guide — print at end of session"
      >
        <DCArtboard id="medal" label="medal.html — 5 Role Medals" width={500} height={560}
          download="medal.html" downloadFormat="A4">
          <PageFrame src="medal.html" width={500} height={560} />
        </DCArtboard>

        <DCArtboard id="diploma" label="diploma.html — Healthy Food Detective Diploma (A4)" width={560} height={720}
          download="diploma.html" downloadFormat="A4">
          <PageFrame src="diploma.html" width={560} height={720} />
        </DCArtboard>

        <DCArtboard id="teacher-guide" label="teacher-guide.html — Teacher Guide (2 × A4)" width={560} height={900}
          download="teacher-guide.html" downloadFormat="2×A4">
          <PageFrame src="teacher-guide.html" width={560} height={900} />
        </DCArtboard>
      </DCSection>

    </DesignCanvas>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
<script>document.addEventListener('DOMContentLoaded', function(){ twemoji.parse(document.body, {folder:'svg',ext:'.svg'}); });</script>
</body>
</html>
